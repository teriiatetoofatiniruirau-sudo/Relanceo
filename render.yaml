# Render blueprint (facultatif) — rend le déploiement presque automatique
# Usage : Connectez votre repo sur render.com, ajoutez un "Blueprint".
services:
  - type: web
    name: relanceo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ESSENTIEL
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
