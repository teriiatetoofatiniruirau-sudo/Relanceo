<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paylora — Espace de travail</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;padding:13px 22px;background:#e3e8ee;border-bottom:1px solid var(--line);position:sticky;top:0">
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <strong>💵 Paylora</strong>
    <span id="plan-badge" class="badge b-gray">…</span>
    <a href="/" style="font-size:13px">↖ Public</a>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span id="who" class="hint"></span>
    <button id="btn-portal" class="btn ghost sm hidden">💳 Abonnement</button>
    <button id="btn-logout" class="btn ghost sm">Déconnexion</button>
  </div>
</header>

<main style="max-width:1180px;margin:0 auto;padding:18px 22px 60px;display:grid;gap:16px">

  <section class="kpi">
    <div class="tile"><div class="n" id="k-impayees">—</div><div class="l">Factures impayées</div></div>
    <div class="tile"><div class="n" id="k-retard">—</div><div class="l">En retard</div></div>
    <div class="tile"><div class="n" id="k-recouvre">—</div><div class="l">Récupéré</div></div>
    <div class="tile"><div class="n" id="k-envoyees">—</div><div class="l">Relances envoyées</div></div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">📄 Factures impayées</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="btn-sample" class="btn ghost sm">✨ Charger un échantillon</button>
        <button id="btn-generate" class="btn sm">📝 Générer les relances dues</button>
      </div>
    </div>
    <div style="overflow:auto;margin-top:8px"><table id="inv-table"></table></div>
    <p class="hint" id="inv-empty"></p>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">✉️ Relances générées</h2>
      <button id="btn-send-all" class="btn sm">📤 Tout envoyer</button>
    </div>
    <div style="overflow:auto;margin-top:8px"><table id="rem-table"></table></div>
    <p class="hint" id="rem-empty"></p>
  </section>

  <section class="card grid" style="grid-template-columns:1fr 1fr">
    <div>
      <h3 style="margin-top:0">⬆️ Importer des factures (CSV)</h3>
      <textarea id="csv" class="mono" rows="6" style="width:100%" placeholder="numero ; client ; email ; montant ; date_echeance ; statut
F-2026-0102 ; SARL Dupont ; contact@dupont.fr ; 2450,00 ; 01/08/2026 ; impayee"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button id="btn-import" class="btn sm">Importer</button>
        <button id="btn-csv-demo" class="btn ghost sm">Coller un exemple</button>
      </div>
    </div>
    <div>
      <h3 style="margin-top:0">➕ Ajouter une facture</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label>Numéro <input id="m-numero" placeholder="F-2026-0120"></label>
        <label>Montant € <input id="m-montant" type="number" step="0.01" placeholder="1200,00"></label>
        <label>Client <input id="m-client"></label>
        <label>Email client <input id="m-email"></label>
        <label style="grid-column:1/-1">Échéance <input id="m-echeance" placeholder="JJ/MM/AAAA"></label>
      </div>
      <button id="btn-add" class="btn sm" style="margin-top:10px">Ajouter</button>
    </div>
  </section>

  <section class="card grid" style="grid-template-columns:1fr 1fr">
    <div>
      <h3 style="margin-top:0">⚙️ Réglages</h3>
      <label>Entreprise émettrice <input id="s-company"></label>
      <label>Email émetteur <input id="s-sender"></label>
      <label>Ton <select id="s-tone">
        <option value="courtois">Courtois</option><option value="commercial">Commercial</option><option value="ferme">Ferme</option>
      </select></label>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <label>Palier 1 (j) <input id="s-d1" type="number"></label>
        <label>Palier 2 (j) <input id="s-d2" type="number"></label>
        <label>Palier 3 (j) <input id="s-d3" type="number"></label>
      </div>
      <button id="btn-save" class="btn sm" style="margin-top:8px">💾 Enregistrer</button>
    </div>
    <div>
      <h3 style="margin-top:0">📜 Journal</h3>
      <pre id="journal" class="mono" style="background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px"></pre>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
